name = "kissmyskills-agent-readiness"
main = "worker.js"
compatibility_date = "2026-08-13"

# Deliberately narrow. The worker sits ONLY on the homepage and the .well-known
# namespace. Do NOT add "kissmyskills.com/*" — that would put the entire
# storefront behind this code, and a bad deploy would take the shop down.
# Leading wildcard matters. `kissmyskills.com/` was created without error and
# showed up in the dashboard, but produced zero invocations — Cloudflare matched
# it literally and never applied it. `*kissmyskills.com/...` is the form that
# actually catches traffic.
[[routes]]
pattern = "*kissmyskills.com/"
zone_name = "kissmyskills.com"

[[routes]]
pattern = "*kissmyskills.com/.well-known/*"
zone_name = "kissmyskills.com"

# Rollback: `npx wrangler rollback` restores the previous version.
# Full removal: `npx wrangler delete` — routes disappear with the worker and
# the site returns to serving straight from Shopify.
